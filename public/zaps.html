<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Zaps - Medusa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e5ddd5; margin: 0; padding: 20px; color: #303030; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,.1); }
        h1 { color: #075e54; border-bottom: 2px solid #25D366; padding-bottom: 10px; margin-top: 0; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav a { padding: 10px 20px; background: #f0f0f0; border-radius: 5px; text-decoration: none; color: #075e54; font-weight: bold; }
        .nav a:hover { background: #e0e0e0; }

        .btn { background: #25D366; color: #fff; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: .2s; }
        .btn:hover { background: #128C7E; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-danger { background: #d32f2f; } .btn-danger:hover { background: #b71c1c; }
        .btn-secondary { background: #34b7f1; } .btn-secondary:hover { background: #0097d6; }
        .btn-sm { padding: 6px 10px; font-size: 12px; }

        .zap-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; }
        .zap-card { background: #f9f9f9; border: 1px solid #ddd; padding: 16px; border-radius: 8px; text-align: center; }
        .zap-card h3 { margin: 0 0 6px; color: #075e54; font-size: 15px; }
        .zap-card.admin-card { border: 2px solid #7b1fa2; background: linear-gradient(135deg, #f3e5f5, #fff 60%); }
        .zap-card.admin-card h3 { color: #4a148c; font-size: 13px; }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin: 6px 0 10px; }
        .badge-online     { background: #dcf8c6; color: #075e54; }
        .badge-connecting { background: #fff9c4; color: #f57f17; }
        .badge-offline    { background: #ffebee; color: #d32f2f; }
        .badge-admin      { background: #e1bee7; color: #4a148c; border: 1px solid #7b1fa2; }

        .btn-group { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

        /* Modal QR */
        .qr-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1000; align-items: center; justify-content: center; }
        .qr-modal.active { display: flex; }
        .qr-box { background: #fff; padding: 28px; border-radius: 16px; text-align: center; max-width: 340px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
        .qr-box h2 { color: #075e54; margin: 0 0 8px; font-size: 18px; }
        .qr-box img { width: 250px; height: 250px; border: 4px solid #25D366; border-radius: 8px; margin: 12px auto; display: block; }
        .qr-hint { font-size: 12px; color: #666; margin: 0 0 12px; }
        .qr-status { font-size: 13px; font-weight: bold; color: #555; }
        .qr-spinner { border: 4px solid #f0f0f0; border-top-color: #25D366; border-radius: 50%; width: 48px; height: 48px; animation: spin .8s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Modal QR Code -->
    <div class="qr-modal" id="qrModal">
        <div class="qr-box">
            <h2 id="qrTitle">📱 Escaneie o QR Code</h2>
            <div id="qrContent">
                <div class="qr-spinner"></div>
                <p class="qr-status">Gerando QR Code...</p>
            </div>
            <p class="qr-hint">WhatsApp → Dispositivos Vinculados → Vincular dispositivo</p>
            <button class="btn btn-danger btn-sm" onclick="closeQRModal()" style="margin-top:8px;">✖ Fechar</button>
        </div>
    </div>

    <div class="container">
        <h1>🔌 Gestão de Zaps</h1>

        <div class="nav">
            <a href="index.html">← Painel</a>
            <a href="aquecimento.html">🔥 Aquecimento</a>
        </div>

        <div class="zap-list" id="zapsList"></div>
    </div>

<script>
    let qrPollInterval  = null;
    let currentQrAccount = null;

    // ── QR Modal ──────────────────────────────────────────────────────────────
    function openQRModal(accountId, initialQr) {
        currentQrAccount = accountId;
        document.getElementById('qrTitle').textContent = `📱 ${accountId}`;
        const content = document.getElementById('qrContent');
        content.innerHTML = initialQr
            ? `<img src="${initialQr}" alt="QR Code"><p class="qr-status">Aguardando leitura...</p>`
            : `<div class="qr-spinner"></div><p class="qr-status">Gerando QR Code...</p>`;
        document.getElementById('qrModal').classList.add('active');
        clearInterval(qrPollInterval);
        qrPollInterval = setInterval(() => pollQR(accountId), 3000);
    }

    function closeQRModal() {
        clearInterval(qrPollInterval);
        qrPollInterval = null;
        currentQrAccount = null;
        document.getElementById('qrModal').classList.remove('active');
    }

    async function pollQR(accountId) {
        try {
            const data    = await fetch(`/api/whatsapp/qrcode/${accountId}`).then(r => r.json());
            const content = document.getElementById('qrContent');
            if (!content) return;
            if (data.state === 'open') {
                clearInterval(qrPollInterval);
                content.innerHTML = `<p style="font-size:48px">✅</p><p class="qr-status" style="color:#075e54">Conectado!</p>`;
                setTimeout(() => { closeQRModal(); refreshStatus(); }, 2000);
                return;
            }
            if (data.qrcode) {
                content.innerHTML = `<img src="${data.qrcode}" alt="QR Code"><p class="qr-status">Aguardando leitura...</p>`;
            }
        } catch (_) {}
    }

    // ── Status ────────────────────────────────────────────────────────────────
    async function refreshStatus() {
        try {
            const data = await fetch('/api/zaps-status').then(r => r.json());
            renderZapCards(data);
        } catch (_) {}
    }

    function renderZapCards(data) {
        const container = document.getElementById('zapsList');
        container.innerHTML = '';
        data.forEach(zap => {
            const card = document.createElement('div');

            if (zap.isAdmin) {
                card.className = 'zap-card admin-card';
                const isOpen   = zap.state === 'open';
                const badgeCls = isOpen ? 'badge-admin' : 'badge-offline';
                const btn      = isOpen
                    ? `<button class="btn btn-danger btn-sm" onclick="deleteZap('${zap.accountId}')">🗑️</button>`
                    : `<button class="btn btn-secondary btn-sm" onclick="connectZap('${zap.accountId}')">📷 Conectar</button>`;
                card.innerHTML = `
                    <h3>👑 Admin<br><span style="font-size:11px;color:#888">${zap.accountId}</span></h3>
                    <span class="badge ${badgeCls}">${isOpen ? '👑 Online' : '❌ Offline'}</span>
                    <div class="btn-group">${btn}</div>`;
                container.appendChild(card);
                return;
            }

            card.className = 'zap-card';
            let badgeCls, badgeTxt;
            if      (zap.state === 'open')       { badgeCls = 'badge-online';     badgeTxt = '✅ Ativo'; }
            else if (zap.state === 'connecting') { badgeCls = 'badge-connecting'; badgeTxt = '⏳ Conectando'; }
            else if (zap.hasInstance)            { badgeCls = 'badge-offline';    badgeTxt = '❌ Desconectado'; }
            else                                 { badgeCls = 'badge-offline';    badgeTxt = '⬜ Sem sessão'; }

            let buttons;
            if (zap.state === 'open') {
                buttons = `<button class="btn btn-danger btn-sm" onclick="deleteZap('${zap.accountId}')">🗑️ Excluir</button>`;
            } else {
                const lbl = zap.hasInstance ? '🔄 Reconectar' : '📷 QR Code';
                buttons = `
                    <button class="btn btn-secondary btn-sm" onclick="connectZap('${zap.accountId}')">${lbl}</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteZap('${zap.accountId}')" ${!zap.hasInstance ? 'disabled' : ''}>🗑️</button>`;
            }

            card.innerHTML = `
                <h3>${zap.accountId}</h3>
                <span class="badge ${badgeCls}">${badgeTxt}</span>
                <div class="btn-group">${buttons}</div>`;
            container.appendChild(card);
        });
    }

    // ── Ações ─────────────────────────────────────────────────────────────────
    async function connectZap(accountId) {
        try {
            const data = await fetch('/api/whatsapp/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accountId }),
            }).then(r => r.json());
            if (data.connected) { refreshStatus(); return; }
            if (data.error)     { alert(`Erro: ${data.error}`); return; }
            openQRModal(accountId, data.base64 || null);
        } catch (_) { alert('Erro ao conectar.'); }
    }

    async function deleteZap(accountId) {
        if (!confirm(`Apagar sessão de ${accountId}?\nPrecisará escanear o QR Code novamente.`)) return;
        try {
            await fetch(`/api/whatsapp/${accountId}`, { method: 'DELETE' });
            refreshStatus();
        } catch (_) {}
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    refreshStatus();
    setInterval(refreshStatus, 30000);
</script>
</body>
</html>
